spring.application.name=auth-service
server.port=8088

# --- DataSource ---
spring.datasource.url=jdbc:postgresql://localhost:5433/tms_auth_db
spring.datasource.username=tms_user
spring.datasource.password=tms_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- JWT ---
jwt.secret=tms-logistica-auth-secret-key-2025-minimum-256-bits-long-for-hs256
jwt.access-token-expiration-ms=3600000
jwt.refresh-token-expiration-ms=604800000

# --- Swagger ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
