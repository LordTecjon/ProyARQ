# Perfil de demostracion: base H2 en memoria, se crea vacia en cada arranque.
# Uso: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Consola web de H2 para ver las filas: http://localhost:8087/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
