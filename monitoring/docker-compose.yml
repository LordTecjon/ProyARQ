version: '3.8'

# =====================================================================
# Stack de Observabilidad y Monitoreo (Tema Individual 0.7.4)
# Prometheus recolecta las métricas de customer-service (:8084) y
# auth-service (:8088), y Grafana las visualiza (dashboard RED).
#
# Los servicios corren en el HOST (mvnw spring-boot:run), no en Docker;
# por eso Prometheus los alcanza vía host.docker.internal.
# =====================================================================

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: tms_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: tms_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
